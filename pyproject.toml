[project]
name = "market-edge"
version = "0.1.0"
description = "LLM-powered prediction market trading agent and alpha research framework"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.81.0",
    "apscheduler>=3.11.2",
    "click>=8.3.1",
    "httpx>=0.28.1",
    "py-clob-client>=0.34.5",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.0",
    "rich>=14.3.2",
    "tavily-python>=0.7.21",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "aiosqlite>=0.21.0",
]

[project.scripts]
polymarket = "polymarket_agent.cli.main:cli"
polymarket-dashboard = "polymarket_dashboard.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polymarket_agent", "src/polymarket_dashboard"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
