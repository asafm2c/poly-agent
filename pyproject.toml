[project]
name = "polymarket-agent"
version = "0.1.0"
description = "Autonomous Polymarket trading agent powered by LLM probability estimation"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.81.0",
    "apscheduler>=3.11.2",
    "click>=8.3.1",
    "httpx>=0.28.1",
    "py-clob-client>=0.34.5",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.0",
    "rich>=14.3.2",
    "tavily-python>=0.7.21",
]

[project.scripts]
polymarket = "polymarket_agent.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polymarket_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
